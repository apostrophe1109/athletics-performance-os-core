name: APOS Worker Manual Deployment Gate
run-name: APOS Worker ${{ inputs.mode }} @ ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "validate = 認証/構文/Cloudflare dry-runのみ（書込0） / deploy = 本番Worker Deploy"
        required: true
        default: validate
        type: choice
        options:
          - validate
          - deploy
      expected_commit_sha:
        description: "Maintenance自動dispatch時の期待commit SHA。手動bootstrapでは空欄可。"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: apos-worker-manual-deployment
  cancel-in-progress: false

jobs:
  preflight:
    name: Worker preflight (non-write)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify expected commit SHA
        shell: bash
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          ACTUAL_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$EXPECTED_COMMIT_SHA" ]; then
            [[ "$EXPECTED_COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "expected_commit_sha invalid"; exit 1; }
            [ "${EXPECTED_COMMIT_SHA,,}" = "${ACTUAL_COMMIT_SHA,,}" ] || {
              echo "Expected commit does not match workflow commit. Deployment blocked."
              exit 1
            }
          fi
          echo "Commit guard: OK"

      - name: Validate required configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APOS_WORKER_NAME: ${{ vars.APOS_WORKER_NAME }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID missing"; exit 1; }
          test -n "$APOS_WORKER_NAME" || { echo "APOS_WORKER_NAME missing"; exit 1; }
          test -f system/worker.js || { echo "system/worker.js missing"; exit 1; }
          echo "Required configuration: OK"

      - name: Syntax check
        run: node --check system/worker.js

      - name: Cloudflare authentication check (read-only)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 whoami

      - name: Wrangler build dry-run (non-write)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APOS_WORKER_NAME: ${{ vars.APOS_WORKER_NAME }}
        run: |
          npx --yes wrangler@4 deploy system/worker.js \
            --name "$APOS_WORKER_NAME" \
            --compatibility-date 2026-08-14 \
            --keep-vars \
            --var APOS_DEPLOY_COMMIT:${{ github.sha }} \
            --dry-run \
            --outdir /tmp/apos-worker-dry-run

  deploy:
    name: Deploy Worker (write)
    needs: preflight
    if: ${{ inputs.mode == 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            deploy system/worker.js
            --name ${{ vars.APOS_WORKER_NAME }}
            --compatibility-date 2026-08-14
            --keep-vars
            --var APOS_DEPLOY_COMMIT:${{ github.sha }}

      - name: Confirm Cloudflare deployment registry (read-only)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APOS_WORKER_NAME: ${{ vars.APOS_WORKER_NAME }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deployments status \
            --name "$APOS_WORKER_NAME" \
            --json > /tmp/apos-worker-deployment.json
          python - <<'PY'
          import json
          with open('/tmp/apos-worker-deployment.json', 'r', encoding='utf-8') as f:
              json.load(f)
          print('Cloudflare deployment registry: readable')
          PY

      - name: Deployment completed
        run: |
          echo "Worker deployment command completed."
          echo "deployed_commit=${{ github.sha }}"
          echo "APOS health + View READ-back are still required before VERIFIED."
